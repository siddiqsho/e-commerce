<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=shopping_cart" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>

<body>
    <header>
        <h1>MyStore</h1>
        <span class="material-symbols-outlined">
            shopping_cart
        </span>
    </header>

    <main>
        <div class="search-filters-container">

            <div class="search-group">
                <input type="text" class="search-input" placeholder="search...">
                <button class="search-btn">Search</button>
            </div>

            <div class="filters-group">

                <select name="" id="" class="filter-category">
                    <option value="" disabled selected hidden>Category</option>
                </select>

                <select name="" id="" class="filter-price">
                    <option value="" disabled selected hidden>Price</option>
                </select>

                <select name="" id="" class="filter-sort">
                    <option value="" disabled selected hidden>Sort</option>
                </select>
            </div>

        </div>

        <div class="parent-cards">

        </div>
    </main>
</body>

</html>
