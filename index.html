<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=shopping_cart" />
    <title>ShopSwift</title>
    <link rel="stylesheet" href="style.css">

    <script src="index.js" defer type="module"></script>
</head>

<body>
    <header>
        <h1 class="web-name">ShopSwift</h1>
        <span class="material-symbols-outlined">
            shopping_cart
        </span>
    </header>

    <main>
        <div class="search-filters-container">

            <div class="search-group">
                <input type="text" class="form-control search-input" placeholder="Поиск...">
                <button class="form-control search-btn">Поиск</button>
            </div>

            <div class="filters-group">

                <select name="category" id="category" class="form-control filter-select filter-category">
                    <option value="" selected hidden>Категория</option>
                </select>

                <select name="price" id="price" class="form-control filter-select filter-price">
                    <option value="" selected hidden>Цена</option>
                    <option value="min">От дешевых к дорогим</option>
                    <option value="max">От дорогих к дешевым</option>
                </select>

                <select name="sort" id="sort" class="form-control filter-select filter-sort">
                    <option value="" selected hidden>Сортировка</option>
                </select>
            </div>

        </div>

        <div class="parent-cards">

        </div>
    </main>
</body>

</html>
